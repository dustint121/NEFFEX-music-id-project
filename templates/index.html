<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEFFEX Identifier</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>NEFFEX Identifier</h1>
      <p class="subtitle" id="library">Loading library...</p>
    </header>

    <section class="recorder">
      <button id="record" class="record-button" type="button" aria-pressed="false"
              aria-label="Start listening">
        <svg class="progress" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="progress-track" cx="60" cy="60" r="54"></circle>
          <circle class="progress-bar" id="progress" cx="60" cy="60" r="54"></circle>
        </svg>
        <span class="level" id="level" aria-hidden="true"></span>
        <span class="record-label" id="record-label">Listen</span>
      </button>

      <div class="mode" role="group" aria-label="Recognition method">
        <label class="mode-name" for="mode-switch" data-mode="landmark">Landmark</label>
        <label class="switch">
          <input type="checkbox" id="mode-switch" role="switch" aria-label="Use neural network">
          <span class="slider"></span>
        </label>
        <label class="mode-name" for="mode-switch" data-mode="neural">Neural</label>
      </div>
      <p class="mode-hint" id="mode-hint"></p>

      <p class="status" id="status" role="status" aria-live="polite">
        Tap the button and hold your device near the music.
      </p>
    </section>

    <section class="result" id="result" hidden aria-live="polite">
      <p class="result-kicker" id="result-kicker"></p>
      <h2 class="result-title" id="result-title"></h2>
      <p class="result-meta" id="result-meta"></p>
      <ul class="alternatives" id="alternatives"></ul>
    </section>

    <footer class="footer">
      Listens for {{ '%g' % record_seconds }}s (tap again to stop early, minimum {{ '%g' % min_seconds }}s).
      Audio is sent to this server only to identify the song and is not stored.
    </footer>
  </main>

  <script>
    window.APP_CONFIG = {
      minSeconds: {{ min_seconds }},
      recordSeconds: {{ record_seconds }},
      workletUrl: "{{ url_for('static', filename='recorder-worklet.js') }}"
    };
  </script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
